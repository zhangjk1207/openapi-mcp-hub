name: docker

# 构建多架构镜像推到 GitHub Container Registry（ghcr.io）。
# 触发：release 发布（带上 semver tag）+ 手动触发（用于验证 Dockerfile 改动）。
# 认证：GITHUB_TOKEN 自带 packages:write，不需要任何额外 secret。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)
          echo "testing $TAG"
          docker run -d --name gw -p 20033:20033 \
            -e OPENAPI_MCP_HUB_ADMIN_TOKEN=ci-token "$TAG"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:20033/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          docker logs gw | tail -20
          docker rm -f gw
          test "$ok" = "1"
