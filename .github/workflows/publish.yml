name: publish

# 发布到 PyPI：由 GitHub Release 触发（tag 必须与 pyproject.toml 的 version 一致）。
# 使用 PyPI Trusted Publishing（OIDC）——不需要在仓库里存 API token。
# 首次发布前，需在 https://pypi.org/manage/account/publishing/ 添加 trusted publisher：
#   PyPI Project Name: openapi-mcp-hub
#   Owner: zhangjk1207    Repository: openapi-mcp-hub
#   Workflow name: publish.yml    Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata and long description
        run: python -m twine check --strict dist/*

      - name: Version must match the release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'^version = "(.+?)"', text, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if version != tag:
              sys.exit(f"pyproject version {version!r} != release tag {tag!r}")
          print(f"version {version} matches tag")
          PY

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import importlib.resources as res, openapi_mcp_hub; \
            assert res.files('openapi_mcp_hub').joinpath('demo_spec.json').is_file(), 'demo spec missing'; \
            assert res.files('openapi_mcp_hub').joinpath('static/index.html').is_file(), 'console html missing from wheel'; \
            print('wheel import OK, version', openapi_mcp_hub.__version__)"
          test -x /tmp/smoke/bin/openapi-mcp-hub
          /tmp/smoke/bin/openapi-mcp-hub --version
          # 桥是只吃 stdio 的客户端与官方 registry 的入口，缺了就是发一个装不上的版本
          /tmp/smoke/bin/openapi-mcp-hub bridge --help >/dev/null
          # 真启动一次：console 与 healthz 只有在 wheel 里带上 static/ 时才 200
          OPENAPI_MCP_HUB_ADMIN_TOKEN=ci /tmp/smoke/bin/openapi-mcp-hub \
            --host 127.0.0.1 --port 21099 --data-dir /tmp/smoke-data >/tmp/smoke.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:21099/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          cat /tmp/smoke.log | tail -20
          test "$ok" = "1" || { echo "healthz never came up"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:21099/)" = "200" || { echo "console not served"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:21099/mcp/nope)" = "404" || { echo "unknown service should 404"; exit 1; }
          echo "console + healthz OK from the built wheel"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openapi-mcp-hub
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
