[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-mcp-hub"
version = "0.6.0"
description = "Turn any OpenAPI spec — or a live PostgreSQL/MySQL database — into production-ready MCP endpoints. One process, one port, zero code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "openapi-mcp-hub contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "openapi",
    "swagger",
    "gateway",
    "ai-agents",
    "llm-tools",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # 基于 mcp SDK 2.x（snake_case types、构造器注入回调、jsonschema 入参校验由网关自实现）
    "mcp>=2,<3",
    "jsonschema>=4",
    "httpx>=0.27",
    # httpx 检测到这两个库后才会广告并自动解压 br/zstd（否则只支持 gzip/deflate）
    "brotli>=1.1",
    "zstandard>=0.18",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # PostgreSQL 持久化后端（OPENAPI_MCP_HUB_DATABASE_URL，不配则用文件后端）
    "asyncpg>=0.29",
    # MySQL 只读注册源（dialect 由 DSN 前缀推断）
    "aiomysql>=0.2",
    # 数据面 JWT 认证（MCP OAuth 2.1 resource server 角色；[crypto] 带 RS/ES256）
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
openapi-mcp-hub = "openapi_mcp_hub.main:main"

[project.urls]
Homepage = "https://github.com/zhangjk1207/openapi-mcp-hub"
Repository = "https://github.com/zhangjk1207/openapi-mcp-hub"
Issues = "https://github.com/zhangjk1207/openapi-mcp-hub/issues"
Changelog = "https://github.com/zhangjk1207/openapi-mcp-hub/blob/main/CHANGELOG.md"
Documentation = "https://github.com/zhangjk1207/openapi-mcp-hub/blob/main/USAGE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openapi_mcp_hub = ["demo_spec.json", "static/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B"]
