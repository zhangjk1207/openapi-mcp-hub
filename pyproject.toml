[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-mcp-hub"
version = "0.4.0"
description = "OpenAPI → MCP 网关：POST 一份 openapi.json，即刻生成可接入 agent 的 MCP 端点"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "openapi-mcp-hub contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # 基于 mcp SDK 2.x（snake_case types、构造器注入回调、jsonschema 入参校验由网关自实现）
    "mcp>=2,<3",
    "jsonschema>=4",
    "httpx>=0.27",
    # httpx 检测到这两个库后才会广告并自动解压 br/zstd（否则只支持 gzip/deflate）
    "brotli>=1.1",
    "zstandard>=0.18",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # PostgreSQL 持久化后端（OPENAPI_MCP_HUB_DATABASE_URL，不配则用文件后端）
    "asyncpg>=0.29",
    # MySQL 只读注册源（dialect 由 DSN 前缀推断）
    "aiomysql>=0.2",
    # 数据面 JWT 认证（MCP OAuth 2.1 resource server 角色；[crypto] 带 RS/ES256）
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
openapi-mcp-hub = "openapi_mcp_hub.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openapi_mcp_hub = ["demo_spec.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B"]
